<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapter 17 Transition</title>
    <style>
        /* --- Global Styles --- */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: -webkit-fill-available; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 👉 iOS FIX: Attaching the gradient to a pseudo-element avoids Safari's height blending bug completely */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            z-index: -1;
        }

        html {
            height: -webkit-fill-available;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* --- Floating Hearts Background --- */
        .heart {
            position: absolute;
            bottom: -60px;
            fill: rgba(255, 105, 180, 0.45);
            animation: floatUp 8s infinite linear;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { bottom: -60px; opacity: 0; transform: translateY(0) rotate(0deg); }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { bottom: 105vh; opacity: 0; transform: translateY(-100px) rotate(20deg); }
        }

        /* --- Confetti Particles --- */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 2;
            opacity: 0;
            top: -20px;
            animation: fall 3s ease-out forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        /* --- UI Buttons --- */
        button {
            background: linear-gradient(135deg, #ff4a7d 0%, #e03565 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 74, 125, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 30px;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.98); }
        .hidden { display: none !important; }

        .open-btn-style {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .open-btn-style.reveal-active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- Number (Age) --- */
        .age-number {
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #9b1c31 0%, #ff2a5f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop-animation {
            animation: popChange 0.8s forwards;
        }

        @keyframes popChange {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); filter: drop-shadow(0px 10px 15px rgba(255,42,95,0.4)); }
            100% { transform: scale(1); }
        }

        /* --- Cake Elements --- */
        .cake-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .cake-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
            filter: drop-shadow(0 0 12px rgba(255, 74, 125, 0.5));
        }

        .torches-container {
            display: flex;
            gap: 12px;
            margin-bottom: -5px;
            z-index: 2;
        }

        .torch {
            width: 7px;
            height: 30px;
            background: linear-gradient(to bottom, #fff, #ffccd5);
            border-radius: 2px;
            position: relative;
        }

        .flame {
            width: 10px;
            height: 16px;
            background: radial-gradient(circle, #ffea00 20%, #ff5100 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            position: absolute;
            top: -14px;
            left: -1px;
            animation: flicker 0.1s ease-in-out infinite alternate;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 1, 1);
        }

        .flame.fade-out {
            opacity: 0;
            animation: none;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.1) rotate(1deg); filter: drop-shadow(0 0 5px #ff5100); }
        }

        .cake-body {
            width: 130px;
            height: 80px;
            background: #fff0f5;
            border-radius: 12px 12px 0 0;
            box-shadow: inset 0 -12px 0 #fbcbc9, 0 6px 12px rgba(0,0,0,0.05);
            position: relative;
        }

        .cake-body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 12px;
            background: #ff758c;
            top: 22px;
            left: 0;
        }

        /* --- 3D Gift Box --- */
        .gift-wrapper {
            width: 130px;
            height: 130px;
            position: relative;
            perspective: 600px;
            opacity: 0;
            transform: scale(0.4) translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        filter 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .gift-wrapper.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .gift-wrapper.show:hover {
            transform: translateY(-5px) scale(1.03);
            filter: drop-shadow(0 0 15px rgba(209, 52, 91, 0.6));
        }

        .gift-box-3d {
            width: 100px;
            height: 100px;
            position: absolute;
            bottom: 0;
            left: 15px;
            background: #d1345b;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .gift-box-3d::before { 
            content: '';
            position: absolute;
            background: #fff0f3;
            width: 20px; 
            height: 100%; 
            left: 40px; 
        }

        .gift-lid {
            width: 110px;
            height: 26px;
            background: #ff4a7d;
            position: absolute;
            top: 6px;
            left: 10px;
            border-radius: 4px;
            box-shadow: 0 3px 4px rgba(0,0,0,0.1);
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left bottom;
        }

        .gift-lid::before {
            content: '';
            position: absolute;
            background: #fff0f3;
            width: 20px;
            height: 100%;
            left: 45px;
        }

        .bow-container {
            position: absolute;
            top: -16px;
            left: 38px;
            width: 50px;
            height: 22px;
            z-index: 4;
            transition: transform 0.6s ease;
            transform-origin: left bottom;
        }
        .bow-left, .bow-right {
            width: 20px;
            height: 16px;
            border: 3px solid #fff0f3;
            border-radius: 50%;
            position: absolute;
            background: transparent;
        }
        .bow-left { transform: rotate(-30deg); left: 2px; }
        .bow-right { transform: rotate(30deg); right: 2px; }

        .gift-wrapper.open-lid .gift-lid {
            transform: rotateZ(-110deg) translate(-15px, -15px);
        }
        .gift-wrapper.open-lid .bow-container {
            transform: rotateZ(-110deg) translate(-15px, -15px);
            opacity: 0.5;
        }

        /* --- Letter Deck Container --- */
        .reveal-deck {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
            z-index: 20;
            box-sizing: border-box;
        }

        /* --- Light Pink Paper / Letter --- */
        .paper {
            width: 100%;
            max-width: 320px;
            height: 260px;
            background-color: #fff2f5;
            border: 1px solid #ffdae2;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(224, 53, 101, 0.12);
            padding: 20px;
            box-sizing: border-box;
            transform: scale(0) translateY(40px);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }

        .reveal-deck.active .paper {
            transform: scale(1) translateY(0);
        }

        .paper textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #5c4349;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="something-about-you.mp3" loop></audio>

    <div class="container">
        <div id="age" class="age-number">16</div>

        <div id="cakeSection" class="cake-wrapper">
            <div class="torches-container">
                <div class="torch"><div class="flame"></div></div>
                <div class="torch"><div class="flame"></div></div>
                <div class="torch"><div class="flame"></div></div>
            </div>
            <div class="cake-body"></div>
        </div>

        <div id="giftSection" class="gift-wrapper hidden">
            <div class="bow-container">
                <div class="bow-left"></div>
                <div class="bow-right"></div>
            </div>
            <div class="gift-lid"></div>
            <div class="gift-box-3d"></div>
        </div>

        <button id="nextBtn">Next Chapter</button>
        <button id="openBtn" class="hidden open-btn-style">Open</button>

        <div id="revealDeck" class="reveal-deck">
            <div class="paper">
                <textarea readonly>
Happy 17th Birthday! 🎂

Welcome to your next chapter. 
May this year bring you closer to all your dreams and goals.
                </textarea>
            </div>
        </div>
    </div>

    <script>
        // --- Generate Floating Hearts ---
        function createHearts() {
            const body = document.body;
            for (let i = 0; i < 15; i++) {
                let heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                heart.classList.add('heart');
                heart.setAttribute("viewBox", "0 0 24 24");
                heart.innerHTML = `<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>`;
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 5 + 's';
                let size = Math.random() * 15 + 30;
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                body.appendChild(heart);
            }
        }
        createHearts();

        // --- Generate Confetti ---
        function triggerConfetti() {
            const body = document.body;
            const colors = ['#ff4a7d', '#ff85a2', '#ffccd5', '#fff0f3', '#ffe3e8'];
            for (let i = 0; i < 50; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 5 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 6 + 'px';
                confetti.style.animationDelay = Math.random() * 0.4 + 's';
                confetti.style.animationDuration = Math.random() * 1.5 + 1.8 + 's';
                body.appendChild(confetti);
            }
        }

        // --- Core Logics ---
        const nextBtn = document.getElementById('nextBtn');
        const openBtn = document.getElementById('openBtn');
        const cakeSection = document.getElementById('cakeSection');
        const giftSection = document.getElementById('giftSection');
        const ageDisplay = document.getElementById('age');
        const flames = document.querySelectorAll('.flame');
        const revealDeck = document.getElementById('revealDeck');
        const bgMusic = document.getElementById('bgMusic');

        let giftReady = false; 

        nextBtn.addEventListener('click', () => {
            nextBtn.classList.add('hidden');
            bgMusic.play().catch(error => console.log("Music waiting:", error));

            ageDisplay.classList.add('pop-animation');
            ageDisplay.textContent = '17';
            triggerConfetti();

            setTimeout(() => {
                flames.forEach(flame => flame.classList.add('fade-out'));

                setTimeout(() => {
                    cakeSection.style.opacity = '0';
                    cakeSection.style.transform = 'scale(0.7)';

                    setTimeout(() => {
                        cakeSection.classList.add('hidden');
                        giftSection.classList.remove('hidden');
                        
                        setTimeout(() => {
                            giftSection.classList.add('show');
                            giftReady = true; 
                        }, 50);
                    }, 800);
                }, 1000);
            }, 700);
        });

        giftSection.addEventListener('click', () => {
            if (giftReady && openBtn.classList.contains('hidden')) {
                giftSection.style.transform = 'scale(1.06) translateY(-4px)';
                setTimeout(() => {
                    giftSection.style.transform = 'scale(1) translateY(0)';
                }, 150);

                openBtn.classList.remove('hidden');
                setTimeout(() => {
                    openBtn.classList.add('reveal-active');
                }, 50);
            }
        });

        openBtn.addEventListener('click', () => {
            openBtn.classList.remove('reveal-active');
            setTimeout(() => {
                openBtn.classList.add('hidden');
            }, 400);
            
            giftSection.classList.add('open-lid');

            setTimeout(() => {
                giftSection.style.opacity = '0';
                giftSection.style.transform = 'scale(0.5) translateY(30px)';

                setTimeout(() => {
                    giftSection.classList.add('hidden');
                    
                    revealDeck.style.display = 'flex';
                    setTimeout(() => {
                        revealDeck.classList.add('active');
                    }, 50);
                }, 400);
            }, 700);
        });
    </script>
</body>
</html>
